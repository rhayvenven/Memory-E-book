<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Memory</title>
    <link rel="stylesheet" href="../css/designs.css" />
    <link href="https://fonts.cdnfonts.com/css/dasher" rel="stylesheet" />
    <link
      href="https://fonts.cdnfonts.com/css/haunted-villa"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/ankesans" rel="stylesheet" />
  </head>
  <body>
    <button
      class="back-button"
      onclick="window.location.href = 'memories.html'"
    >
      <img src="../images/back.png" alt="Back" />
    </button>
    <h1 id="memoryTitle" class="view-title"></h1>
    <div class="view-meta">
      <span id="memoryMood" class="view-mood"></span>
      <span id="memoryDate" class="view-date"></span>
    </div>
    <div id="memoryTags" class="view-tags"></div>
    <div id="memoryImages" class="polaroid-stack"></div>
    <p id="memoryStory" class="view-story"></p>
    <script src="../js/view-memory.js"></script>
  </body>
</html>
